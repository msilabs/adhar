name: CI

on:
    push:
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Node ${{ matrix.node }} · ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                node: [22, 24, 26]
                include:
                    # macOS runners are slow to start; OS-specific bugs rarely depend on the Node version.
                    - os: macos-latest
                      node: 24
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
            - run: npm ci
            # Job logs are not public, so the output is kept and the failing tests are repeated as an annotation.
            - shell: bash
              run: |
                  set -o pipefail
                  npm test 2>&1 | tee test-output.txt
            - if: failure()
              shell: bash
              run: |
                  out=$(grep -v "^ *at " test-output.txt | grep -A16 "^✖" | head -120 || true)
                  out="${out//'%'/'%25'}"
                  out="${out//$'\r'/}"
                  out="${out//$'\n'/'%0A'}"
                  echo "::error title=Failing tests::$out"

    site:
        name: Site builds
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
            - run: npm ci
            - run: node ../node_modules/@msilabs/alo/bin/alo.js build --base /adhar/
              working-directory: site

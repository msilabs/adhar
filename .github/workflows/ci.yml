name: CI

on:
    push:
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Node ${{ matrix.node }} · ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                node: [22, 24, 26]
                include:
                    # macOS runners are slow to start; OS-specific bugs rarely depend on the Node version.
                    - os: macos-latest
                      node: 24
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
            - run: npm ci
            - run: npm test
            # Job logs are not public, so the failing tests are repeated as an annotation.
            - if: failure()
              shell: bash
              run: |
                  out=$(node --test "test/**/*.test.js" 2>&1 | grep -v "^ *at " | grep -A16 "^✖" | head -120 || true)
                  out="${out//'%'/'%25'}"
                  out="${out//$'\r'/}"
                  out="${out//$'\n'/'%0A'}"
                  echo "::error title=Failing tests::$out"
                  exit 1
